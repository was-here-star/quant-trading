[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "0.1.0"
description = "量化交易研究与回测框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "yfinance>=0.2.40",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quant = "quant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
