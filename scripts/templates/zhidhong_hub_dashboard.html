<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指定红策略总看板</title>
<style>
  :root {
    --bg: #121214;
    --sidebar: #0c0c0e;
    --panel: #1a1a1c;
    --card: #1e1e20;
    --line: rgba(255,255,255,.06);
    --text: #f4f4f5;
    --muted: #8b8b93;
    --accent: #e8eaed;
    --teal: #3dd68c;
    --nav-active-bar: #ffffff;
    --nav-active-bg: rgba(255,255,255,.05);
    --nav-active-text: #ffffff;
    --nav-idle: #7a7a84;
    --radius: 16px;
    --shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: 100vh;
    gap: 0;
  }
  .sidebar {
    background: var(--sidebar);
    border-right: 1px solid rgba(255,255,255,.04);
    padding: 22px 12px 16px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 4px 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .brand .mark {
    width: 40px; height: 40px; border-radius: 0; flex-shrink: 0;
    background: transparent;
    display: grid; place-items: center;
    color: #ffffff;
    box-shadow: none;
  }
  .brand .mark svg {
    width: 28px; height: 28px;
    display: block;
  }
  .brand .brand-text { min-width: 0; }
  .brand h1 {
    font-size: 15px; font-weight: 700; letter-spacing: .2px; color: #f4f4f5;
  }
  .brand .sub { margin-top: 3px; font-size: 11px; color: var(--muted); }
  .nav {
    display: flex; flex-direction: column; gap: 6px; flex: 1;
    padding: 2px 0;
  }
  .nav button {
    appearance: none; border: 0; cursor: pointer; text-align: left;
    position: relative;
    background: transparent; color: var(--nav-idle);
    border-radius: 12px; padding: 12px 14px 12px 18px;
    display: flex; align-items: center; gap: 12px;
    font-size: 13.5px; font-weight: 550; letter-spacing: .15px;
    transition: background .15s ease, color .15s ease;
  }
  .nav button::before {
    content: "";
    position: absolute; left: 0; top: 50%;
    transform: translateY(-50%);
    width: 2.5px; height: 0;
    border-radius: 2px;
    background: var(--nav-active-bar);
    transition: height .15s ease;
  }
  .nav button:hover {
    background: rgba(255,255,255,.035);
    color: #d4d4d8;
  }
  .nav button.active {
    background: var(--nav-active-bg);
    color: var(--nav-active-text);
    font-weight: 650;
    box-shadow: none;
  }
  .nav button.active::before { height: 42%; }
  .nav .ico {
    width: 22px; height: 22px; flex-shrink: 0;
    display: grid; place-items: center;
  }
  .nav .ico svg {
    width: 18px; height: 18px;
    stroke: currentColor; fill: none;
    stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round;
  }
  .nav button.active .ico { color: var(--nav-active-text); }
  .nav button:not(.active) .ico { color: var(--nav-idle); }
  .nav .label { flex: 1; }
  .nav .hint { display: none; }
  .side-foot {
    font-size: 11px; color: #6a6a74; padding: 10px 12px 4px;
    border-top: 1px solid rgba(255,255,255,.05);
    line-height: 1.55;
    border-radius: 0;
    background: transparent;
    border-left: 0; border-right: 0; border-bottom: 0;
  }
  .side-foot b { color: #a1a1aa; font-weight: 600; }

  .main {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    padding: 0;
    background: var(--bg);
  }
  .topbar {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 22px 24px 16px;
    border-bottom: 0;
    background: transparent;
  }
  .topbar .title-wrap { min-width: 0; }
  .topbar h2 {
    font-size: 28px; font-weight: 720; color: #fafafa; letter-spacing: -.2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar .meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .topbar .meta b { color: #d4d4d8; }
  .topbar-right {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .asof-chip {
    font-size: 12.5px; color: var(--muted); white-space: nowrap;
    padding: 10px 14px; border-radius: 999px;
    background: var(--card);
    border: 0;
    box-shadow: none;
  }
  .asof-chip b { color: #f4f4f5; font-weight: 650; }

  .hub-action {
    flex-shrink: 0;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    margin: 0 24px 14px;
    padding: 12px 14px; border-radius: 12px;
    background: var(--card);
    font-size: 13px; color: #d4d4d8;
    box-shadow: none;
  }
  .hub-action .pill {
    padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 650;
    background: rgba(61,214,140,.16); color: #3dd68c;
  }
  .hub-action .rebal-meta { margin-left: auto; font-size: 12px; color: #71717a; }
  .hub-action .rebal-meta b { color: #e4e4e7; font-weight: 650; }

  .freq-switch {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px 8px 14px; border-radius: 999px;
    background: var(--card);
    border: 0;
    flex-shrink: 0;
    box-shadow: none;
  }
  .freq-switch .lab {
    font-size: 12.5px; font-weight: 650; color: #7a7a84;
    transition: color .15s;
  }
  .freq-switch .lab.on { color: #f4f4f5; }
  .switch {
    position: relative; width: 44px; height: 24px; border-radius: 999px;
    background: rgba(255,255,255,.12); border: 0;
    cursor: pointer; transition: .18s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #f4f4f5;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    transition: .18s ease;
  }
  .switch.on {
    background: var(--teal);
    border-color: transparent;
  }
  .switch.on::after { left: 22px; }

  .stage {
    flex: 1; min-height: 0; position: relative;
    margin: 0 18px 18px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 0;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .stage iframe {
    width: 100%; height: 100%; border: 0; display: block;
    background: var(--card);
  }
  .stage .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    pointer-events: none; color: var(--muted); font-size: 13px;
    background: rgba(18,18,20,.55);
    opacity: 0; transition: opacity .2s;
    z-index: 2;
  }
  .stage.busy .loading { opacity: 1; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar {
      flex-direction: row; align-items: center; gap: 10px;
      padding: 10px 12px; overflow-x: auto;
      border-right: 0; border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .brand { display: none; }
    .side-foot { display: none; }
    .nav { flex-direction: row; gap: 6px; }
    .nav button { white-space: nowrap; padding: 10px 12px; }
    .nav button::before { display: none; }
    .nav .hint { display: none; }
    .topbar { padding: 14px 14px 10px; }
    .topbar h2 { font-size: 20px; }
    .hub-action { margin: 0 10px 10px; }
    .stage { margin: 0 10px 10px; border-radius: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" title="指定红策略"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <circle cx="34" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3.8"/>
  <path fill="currentColor" d="
    M31.2 20.8c0-2.8 1.9-4.7 4.2-4.7s4.2 1.9 4.2 4.7v17.6c.9-1.2 2.4-1.9 4.1-1.9 2.5 0 4.4 1.9 4.4 4.3V47.2c0 7.4-5.5 12.4-13.6 12.4-6.9 0-12.4-3.5-15.1-9.9L12.9 34.8c-.9-2.1.2-4.5 2.4-5.3 2-.7 4.3.3 5.1 2.3l3.1 7.1c.3.7 1.4.5 1.4-.3V20.8z"/>
</svg></div>
      <div class="brand-text">
        <h1>指定红策略</h1>
        <div class="sub">周期总看板 · 日/月频切换</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">生成 <b id="gen">2026-11-19 12:18</b><br>点击左侧切换周期</div>
  </aside>
  <section class="main">
    <div class="topbar">
      <div class="title-wrap">
        <h2 id="page-title">—</h2>
        <div class="meta">当前频率 <b id="freq-label">日频</b> · 内容来自独立周期看板</div>
      </div>
      <div class="topbar-right">
        <div class="asof-chip">数据日期：<b id="hub-asof">—</b></div>
        <div class="freq-switch" title="切换日频 / 月频">
          <span class="lab on" id="lab-daily">日频</span>
          <div class="switch" id="freq-switch" role="switch" aria-checked="false" tabindex="0"></div>
          <span class="lab" id="lab-monthly">月频</span>
        </div>
      </div>
    </div>
    <div class="hub-action" id="hub-action">
      <span class="pill" id="hub-action-pill">执行建议</span>
      <span id="hub-action-text">加载中…</span>
      <span class="rebal-meta">最近调仓 <b id="hub-kpi-rebal">—</b></span>
    </div>
    <div class="stage" id="stage">
      <div class="loading">加载中…</div>
      <iframe id="frame" title="策略看板" src="about:blank"></iframe>
    </div>
  </section>
</div>
<script>
const SOURCES = {"1年": {"日频": "./指定红看板策略/指定红策略-1年-日频.html?v=fixsplit", "月频": "./指定红看板策略/指定红策略-1年-月频.html?v=fixsplit"}, "5年": {"日频": "./指定红看板策略/指定红策略-5年-日频.html?v=fixsplit", "月频": "./指定红看板策略/指定红策略-5年-月频.html?v=fixsplit"}, "10年": {"日频": "./指定红看板策略/指定红策略-10年-日频.html?v=fixsplit", "月频": "./指定红看板策略/指定红策略-10年-月频.html?v=fixsplit"}, "20年": {"日频": "./指定红看板策略/指定红策略-20年-日频.html?v=fixsplit", "月频": "./指定红看板策略/指定红策略-20年-月频.html?v=fixsplit"}};
const ASOF_MAP = {"1年": {"日频": "2026-11-19 13:01:19", "月频": "2026-11-19 13:01:50"}, "5年": {"日频": "2026-11-19 11:52:54", "月频": "2026-11-19 11:53:01"}, "10年": {"日频": "2026-11-19 11:53:27", "月频": "2026-11-19 11:53:35"}, "20年": {"日频": "2026-11-19 11:54:02", "月频": "2026-11-19 11:54:08"}};
const ICONS = {
  "1年": `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 1.5"/><path d="M12 4v1.2"/></svg>`,
  "5年": `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M4 9.5h16"/><path d="M8.5 14h3.2M8.5 17h7"/></svg>`,
  "10年": `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V6.8c0-.7.5-1.3 1.2-1.4L12 4l6.8 1.4c.7.1 1.2.7 1.2 1.4V19"/><path d="M8 19v-6.5M12 19v-9M16 19v-4.5"/><path d="M4 19h16"/></svg>`,
  "20年": `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c2.2-4.5 5-7.2 8-7.2S17.8 13.5 20 18"/><path d="M12 10.8V5.5"/><circle cx="12" cy="4.2" r="1.2"/><path d="M7.2 13.2c1.3-.9 2.9-1.4 4.8-1.4s3.5.5 4.8 1.4"/></svg>`,
};
const PERIODS = [
  { key: "1年", label: "1年" },
  { key: "5年", label: "5年" },
  { key: "10年", label: "10年" },
  { key: "20年", label: "20年" },
];
let period = "1年";
let monthly = false; // false=日频 true=月频

const nav = document.getElementById("nav");
const frame = document.getElementById("frame");
const stage = document.getElementById("stage");
const sw = document.getElementById("freq-switch");
const labDaily = document.getElementById("lab-daily");
const labMonthly = document.getElementById("lab-monthly");
const pageTitle = document.getElementById("page-title");
const freqLabel = document.getElementById("freq-label");
const hubAsof = document.getElementById("hub-asof");
const hubActionPill = document.getElementById("hub-action-pill");
const hubActionText = document.getElementById("hub-action-text");
const hubKpiRebal = document.getElementById("hub-kpi-rebal");

nav.innerHTML = PERIODS.map(p => `
  <button type="button" data-key="${p.key}" class="${p.key===period?"active":""}">
    <span class="ico">${ICONS[p.key]||""}</span>
    <span class="label">${p.label}</span>
  </button>
`).join("");

function setBusy(on) { stage.classList.toggle("busy", !!on); }

function syncSwitch() {
  sw.classList.toggle("on", monthly);
  sw.setAttribute("aria-checked", monthly ? "true" : "false");
  labDaily.classList.toggle("on", !monthly);
  labMonthly.classList.toggle("on", monthly);
  freqLabel.textContent = monthly ? "月频" : "日频";
}

function currentSrc() {
  const row = SOURCES[period] || {};
  return monthly ? (row["月频"] || "") : (row["日频"] || "");
}

function extractAsofFromHtml(text) {
  const g = text.match(/"generated_at"\s*:\s*"([^"]+)"/);
  if (g) return g[1];
  const a = text.match(/"asof"\s*:\s*"([^"]+)"/);
  return a ? a[1] : "";
}

function hideChildAsof(doc) {
  if (!doc) return;
  const asof = doc.getElementById("asof");
  if (!asof) return;
  // 隐藏「数据日期：…」整段，保留总仓位/调仓
  const wrap = doc.getElementById("asof-wrap");
  if (wrap) {
    wrap.style.display = "none";
    return;
  }
  const meta = asof.parentElement;
  if (!meta) return;
  const html = meta.innerHTML;
  meta.innerHTML = html.replace(/数据日期：\s*<b[^>]*>[\s\S]*?<\/b>\s*　·　/, "");
}

function hideChildAction(doc) {
  if (!doc) return;
  const actionBar = doc.querySelector("#kpi-card-wrap > .action");
  if (actionBar) actionBar.style.display = "none";
}

function applyHubAction(pill, text, rebal, pillStyle) {
  if (pill) hubActionPill.textContent = pill;
  if (text) hubActionText.textContent = text;
  if (rebal) hubKpiRebal.textContent = rebal;
  if (pillStyle) {
    hubActionPill.style.background = pillStyle.background || "";
    hubActionPill.style.color = pillStyle.color || "";
  } else {
    hubActionPill.style.background = "";
    hubActionPill.style.color = "";
  }
}

function extractActionFromHtml(text) {
  // 从内嵌 DATA JSON 推导执行建议（file:// 跨源兜底）
  let data = null;
  try {
    const m = text.match(/const\s+DATA\s*=\s*(\{[\s\S]*?\n\});/);
    if (m) data = JSON.parse(m[1]);
  } catch (e) { data = null; }
  if (!data) return null;
  const valueSector = data.value_sector || "";
  const legName = data.leg === "bank"
    ? "银行腿"
    : (data.leg === "value"
      ? (valueSector ? `价值腿·${valueSector}` : "价值腿")
      : (data.leg === "risk_etf" ? "风险ETF"
        : (data.leg === "blend" ? "风险+银行配比" : "风险腿")));
  let pill = "维持持仓";
  let actionText = `今日无需操作，继续持有 ${legName}（最近调仓 ${data.last_rebal || "—"}），等本月末再决策。`;
  let pillStyle = null;
  if (data.alert) {
    pill = "风险提醒";
    pillStyle = { background: "rgba(255,91,91,.18)", color: "#ff5b5b" };
    actionText = String(data.alert);
  } else if (data.is_rebal) {
    pill = "月末调仓日";
    actionText = `收盘确认信号后，下一交易日按 ${legName} 换仓（T+1）。`;
  }
  return { pill, text: actionText, rebal: data.last_rebal || "—", pillStyle };
}

function syncHubAction(doc) {
  if (!doc) return false;
  const pillEl = doc.getElementById("action-pill");
  const textEl = doc.getElementById("action-text");
  const rebalEl = doc.getElementById("kpi-rebal");
  if (!pillEl || !textEl) return false;
  const pill = (pillEl.textContent || "").trim();
  const text = (textEl.textContent || "").trim();
  if (!pill || pill === "执行建议" || !text || text === "加载中…") return false;
  const rebal = rebalEl ? (rebalEl.textContent || "").trim() : "—";
  const pillStyle = {
    background: pillEl.style.background || "",
    color: pillEl.style.color || "",
  };
  applyHubAction(pill, text, rebal || "—", pillStyle);
  hideChildAction(doc);
  return true;
}

function syncHubAsof(src, attempt) {
  attempt = attempt || 0;
  const apply = (txt) => {
    if (txt) hubAsof.textContent = txt;
  };
  const applyActionFromHtml = (html) => {
    const parsed = extractActionFromHtml(html);
    if (parsed) applyHubAction(parsed.pill, parsed.text, parsed.rebal, parsed.pillStyle);
    return !!parsed;
  };
  const fetchFallback = () => {
    const path = String(src || "").split("?")[0];
    if (!path) return;
    fetch(path)
      .then((r) => r.text())
      .then((t) => {
        apply(extractAsofFromHtml(t) || hubAsof.textContent || "—");
        applyActionFromHtml(t);
        try {
          hideChildAsof(frame.contentDocument);
          hideChildAction(frame.contentDocument);
        } catch (e) {}
      })
      .catch(() => {});
  };
  // file:// 下优先用预埋 ASOF_MAP，避免 iframe/fetch 跨源失败
  try {
    const row = (typeof ASOF_MAP !== "undefined" && ASOF_MAP[period]) || {};
    const pre = monthly ? row["月频"] : row["日频"];
    if (pre && pre !== "—") apply(pre);
  } catch (e) {}

  try {
    const doc = frame.contentDocument;
    const el = doc && doc.getElementById("asof");
    if (el && el.textContent && el.textContent !== "—") {
      apply(el.textContent.trim());
      hideChildAsof(doc);
      if (syncHubAction(doc)) return;
      if (attempt < 12) {
        setTimeout(() => syncHubAsof(src, attempt + 1), 50);
        return;
      }
      // DOM 已就绪但执行建议仍未写出：走 HTML 解析兜底
      fetchFallback();
      return;
    }
    if (attempt < 12) {
      setTimeout(() => syncHubAsof(src, attempt + 1), 50);
      return;
    }
  } catch (e) { /* file 跨文档限制时走 fetch */ }
  fetchFallback();
}

function load() {
  const p = PERIODS.find(x => x.key === period);
  pageTitle.textContent = `指定红策略 · ${p ? p.label : period} · ${monthly ? "月频" : "日频"}`;
  syncSwitch();
  const src = currentSrc();
  if (!src) {
    frame.src = "about:blank";
    pageTitle.textContent += "（缺文件）";
    hubAsof.textContent = "—";
    return;
  }
  try {
    const row = (typeof ASOF_MAP !== "undefined" && ASOF_MAP[period]) || {};
    const pre = monthly ? row["月频"] : row["日频"];
    hubAsof.textContent = (pre && pre !== "—") ? pre : "—";
  } catch (e) { hubAsof.textContent = "—"; }
  applyHubAction("执行建议", "加载中…", "—", null);
  setBusy(true);
  frame.onload = () => {
    setBusy(false);
    syncHubAsof(src);
  };
  frame.src = src;
  // highlight nav
  [...nav.querySelectorAll("button")].forEach(btn => {
    btn.classList.toggle("active", btn.dataset.key === period);
  });
}

nav.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-key]");
  if (!btn) return;
  period = btn.dataset.key;
  load();
});

function toggleFreq() {
  monthly = !monthly;
  load();
}
sw.addEventListener("click", toggleFreq);
sw.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleFreq(); }
});
labDaily.addEventListener("click", () => { if (monthly) { monthly = false; load(); } });
labMonthly.addEventListener("click", () => { if (!monthly) { monthly = true; load(); } });

load();
</script>
</body>
</html>
